name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy libs services replayer scripts tests
      - run: uv run pytest
      - run: uv run python scripts/export_schemas.py --check

  docker:
    name: Docker build (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: ingest, dir: services/ingest, package: incident-ingest }
          - { name: consumer, dir: services/consumer, package: incident-consumer }
          - { name: detector, dir: services/detector, package: incident-detector }
          - { name: knowledge, dir: services/knowledge, package: incident-knowledge }
          - { name: agent, dir: services/agent, package: incident-agent }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: deploy/docker/python-service.Dockerfile
          build-args: |
            SERVICE_DIR=${{ matrix.service.dir }}
            PACKAGE=${{ matrix.service.package }}
          push: false
          load: true
          tags: incident-assistant/${{ matrix.service.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
      - name: Scan image (fail on fixable HIGH/CRITICAL)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image --quiet --ignore-unfixed
          --severity HIGH,CRITICAL --exit-code 1
          incident-assistant/${{ matrix.service.name }}:ci

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan the full history for secrets
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Secrets (gitleaks, full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact
      - name: Known-vulnerable dependencies (pip-audit)
        run: |
          uv export --frozen --all-packages --all-extras --no-hashes --no-emit-workspace > /tmp/reqs.txt
          uvx pip-audit --no-deps --disable-pip --strict -r /tmp/reqs.txt
      - name: Config misconfigurations (trivy)
        run: >-
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.74.0 config --quiet
          --severity HIGH,CRITICAL --exit-code 1 /src

  integration:
    name: Integration (full stack)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start stack
        run: make up
      - name: Crash recovery, DLQ and redelivery tests
        run: make test-integration
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
