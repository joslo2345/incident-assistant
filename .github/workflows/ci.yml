name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy libs services replayer scripts tests
      - run: uv run pytest
      - run: uv run python scripts/export_schemas.py --check

  docker:
    name: Docker build (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: ingest, dir: services/ingest, package: incident-ingest }
          - { name: consumer, dir: services/consumer, package: incident-consumer }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/python-service.Dockerfile
          build-args: |
            SERVICE_DIR=${{ matrix.service.dir }}
            PACKAGE=${{ matrix.service.package }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  integration:
    name: Integration (full stack)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Start stack
        run: make up
      - name: Crash recovery, DLQ and redelivery tests
        run: make test-integration
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v
