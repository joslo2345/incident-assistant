# Weekly PRs for dependency, action and base-image updates (including security fixes).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
    ignore:
      # The project targets Python 3.12 (requires-python <3.13). Only take new 3.12 image digests
      # (security patches), not 3.13/3.14 tags.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule: { interval: weekly }
