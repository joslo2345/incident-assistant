[project]
name = "incident-assistant"
version = "0.1.0"
description = "AI incident assistant for GPU fleets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["incident-contracts", "incident-ingest", "incident-consumer", "incident-detector", "incident-knowledge", "incident-agent", "incident-replayer[prepare]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13.1",
    "asyncpg-stubs>=0.31.3",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/ingest", "services/consumer", "services/detector", "services/knowledge", "services/agent", "replayer"]

[tool.uv.sources]
incident-contracts = { workspace = true }
incident-ingest = { workspace = true }
incident-consumer = { workspace = true }
incident-detector = { workspace = true }
incident-knowledge = { workspace = true }
incident-agent = { workspace = true }
incident-replayer = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "replayer", "tests"]
# Shared test helpers live in uniquely named modules on this path (test dirs aren't packages).
pythonpath = ["services/detector/tests", "services/knowledge/tests", "services/agent/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.isort]
known-first-party = ["incident_contracts", "ingest", "consumer", "detector", "knowledge", "agent", "replayer"]

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*", "fastembed", "fastembed.*", "pgvector", "pgvector.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Dashboard definitions: SQL/PromQL strings read better unbroken.
"scripts/build_dashboards.py" = ["E501"]
# Incident report templates: sentences read better unbroken.
"scripts/generate_incident_reports.py" = ["E501"]
