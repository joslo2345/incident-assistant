[project]
name = "incident-agent"
version = "0.1.0"
description = "Investigation agent: MCP tools over telemetry, logs and the knowledge base, a budgeted agent loop, approvals and traces"
requires-python = ">=3.12,<3.13"
dependencies = [
    "incident-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.31",
    "httpx2>=2.13.1",
    "mcp>=2.2",
    "openai>=3.22",
    "anthropic>=1.11",
    "prometheus-client>=0.26",
    "slack-bolt>=1.30",
    "slack-sdk>=3.45",
    "aiohttp>=3.14",
]

[project.scripts]
agent = "agent.cli:main"

[tool.uv.sources]
incident-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
