[project]
name = "incident-ingest"
version = "0.1.0"
description = "Telemetry ingestion API"
requires-python = ">=3.12,<3.13"
dependencies = ["incident-contracts", "fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.uv.sources]
incident-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
