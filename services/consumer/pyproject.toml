[project]
name = "incident-consumer"
version = "0.1.0"
description = "Kafka -> TimescaleDB telemetry consumer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "incident-contracts",
    "aiokafka>=0.14",
    "asyncpg>=0.31",
    "prometheus-client>=0.26",
]

[tool.uv.sources]
incident-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/consumer"]
