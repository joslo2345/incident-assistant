[project]
name = "incident-detector"
version = "0.1.0"
description = "Anomaly detection: telemetry -> alerts -> incidents"
requires-python = ">=3.12,<3.13"
dependencies = ["incident-contracts", "asyncpg>=0.31", "prometheus-client>=0.26"]

[project.scripts]
detect = "detector.main:main"

[tool.uv.sources]
incident-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]
