[project]
name = "incident-knowledge"
version = "0.1.0"
description = "Runbook and past-incident knowledge base: hybrid search, reranking, cited answers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "incident-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.31",
    "pgvector>=0.4",
    "fastembed>=0.8",
    "pypdf>=6.0",
    "anthropic>=1.11",
    "prometheus-client>=0.26",
]

[project.scripts]
knowledge = "knowledge.cli:main"

[tool.uv.sources]
incident-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]
