[project]
name = "incident-contracts"
version = "0.1.0"
description = "Shared schemas: telemetry events and incident records"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incident_contracts"]
