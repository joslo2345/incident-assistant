# Serves the built UI and proxies the agent API under /api (same origin: the session cookie is
# SameSite=Strict and there is no CORS). Only the people routes are exposed; the agent's machine
# API (API-key auth), /metrics and /docs stay reachable only on the internal network.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 64k;

    location ~ ^/api/v1/(auth|ui)/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://agent:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Investigations and follow-up questions run a local model: minutes, not seconds.
        proxy_read_timeout 900s;
    }

    location /api/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
