repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^deploy/helm/.*/templates/   # Go templates; checked by helm lint + kubeconform
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy libs services replayer scripts tests
        language: system
        types: [python]
        pass_filenames: false
      - id: schemas
        name: generated schemas are current
        entry: uv run python scripts/export_schemas.py --check
        language: system
        files: ^(libs|services|replayer)/.*\.py$
        pass_filenames: false
