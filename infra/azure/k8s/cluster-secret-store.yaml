# External Secrets Operator -> Azure Key Vault with workload identity (no stored credentials).
# Fill in from `terraform output` and apply after installing the operator (docs/INSTALL.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    azure.workload.identity/client-id: "<external_secrets_client_id>"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: "<key_vault_uri>"
      tenantId: "<tenant_id>"
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
