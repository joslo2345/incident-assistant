# Local Kubernetes for testing the Helm chart: `make kind-up`.
# The default kind CNI doesn't enforce NetworkPolicy, so the cluster uses Calico instead.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-assistant
networking:
  disableDefaultCNI: true
  # Not 192.168.0.0/16: Docker Desktop reaches the host (host.docker.internal) at 192.168.65.254,
  # and a pod network covering it swallows that traffic (pods could not reach the Mac's Ollama).
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      # web UI and ingest API through NodePorts, bound to localhost only
      - { containerPort: 30080, hostPort: 3001, listenAddress: "127.0.0.1" }
      - { containerPort: 30800, hostPort: 8000, listenAddress: "127.0.0.1" }
