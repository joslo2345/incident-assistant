{{- if .Values.secrets.externalSecrets.enabled }}
{{- $es := .Values.secrets.externalSecrets }}
# Fills the Secret the pods read from a cloud secret manager (e.g. Azure Key Vault through a
# ClusterSecretStore using workload identity). Values never pass through Helm or Git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.existingSecret }}
  labels: {{- include "ia.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef: {{- toYaml $es.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.existingSecret }}
    creationPolicy: Owner
  data:
    {{- range list "POSTGRES_PASSWORD" "CONSUMER_DB_PASSWORD" "GRAFANA_DB_PASSWORD" "DETECTOR_DB_PASSWORD" "KNOWLEDGE_DB_PASSWORD" "AGENT_DB_PASSWORD" "APPROVAL_DB_PASSWORD" "KNOWLEDGE_API_KEY" "AGENT_API_KEY" "SLACK_BOT_API_KEY" "INGEST_API_KEYS" }}
    - secretKey: {{ . }}
      remoteRef: { key: {{ printf "%s%s" $es.remoteKeyPrefix (. | lower | replace "_" "-") }} }
    {{- end }}
{{- end }}
