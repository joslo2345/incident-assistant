apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    user: grafana_reader  # read-only role with a statement timeout (migration 004)
    jsonData:
      database: telemetry
      sslmode: disable
      timescaledb: true
      postgresVersion: 1700
    secureJsonData:
      password: $TSDB_PASSWORD
