global:
  scrape_interval: 5s

scrape_configs:
  - job_name: ingest
    static_configs: [{ targets: ["ingest:8000"] }]
  - job_name: consumer
    static_configs: [{ targets: ["consumer:9101"] }]
  - job_name: detector
    static_configs: [{ targets: ["detector:9102"] }]
  - job_name: knowledge
    static_configs: [{ targets: ["knowledge:8001"] }]
  - job_name: agent
    static_configs: [{ targets: ["agent:8002"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["redpanda:9644"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
