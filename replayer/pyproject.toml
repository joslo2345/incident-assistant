[project]
name = "incident-replayer"
version = "0.1.0"
description = "Replays cluster traces as GPU telemetry"
requires-python = ">=3.12,<3.13"
dependencies = ["incident-contracts", "httpx2>=2.13"]

[project.optional-dependencies]
# Only needed to rebuild the workload slice from the raw Alibaba trace.
prepare = ["polars>=1.0"]

[project.scripts]
replay = "replayer.cli:main"
replay-prepare = "replayer.prepare:main"

[tool.uv.sources]
incident-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replayer"]
